<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://ddragon.leagueoflegends.com https://raw.communitydragon.org; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>HOWL</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <header class="top">
    <div class="brand" id="brand"></div>
    <nav id="tabs" aria-label="Sections">
      <button data-tab="live" class="active" data-icon="live">Live</button>
      <button data-tab="builds" data-icon="builds">Builds</button>
      <button data-tab="augments" data-icon="augments">Augments</button>
      <button data-tab="stats" data-icon="stats">My stats</button>
      <button data-tab="settings" data-icon="settings">Settings</button>
    </nav>
    <div class="status" id="status"></div>
  </header>
  <main>
    <section id="tab-live" class="tab active"></section>
    <section id="tab-builds" class="tab"></section>
    <section id="tab-augments" class="tab"></section>
    <section id="tab-stats" class="tab"></section>
    <section id="tab-settings" class="tab"></section>
  </main>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
